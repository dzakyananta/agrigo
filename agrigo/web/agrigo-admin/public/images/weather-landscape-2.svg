<?xml version="1.0" encoding="utf-8"?>
<!-- Higher-detail scenic SVG for hero: wide field with distant trees and sky -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="skyGrad" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#daeefc"/>
      <stop offset="45%" stop-color="#bfe7f4"/>
      <stop offset="100%" stop-color="#99d6b8"/>
    </linearGradient>
    <linearGradient id="sunGlow" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#fff6d6" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffe7a3" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="field" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#6fbf6f"/>
      <stop offset="100%" stop-color="#2f7a40"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="600" fill="url(#skyGrad)"/>

  <!-- distant trees -->
  <g transform="translate(0,90)">
    <g fill="#1f3f2f" opacity="0.95">
      <ellipse cx="120" cy="220" rx="80" ry="40"/>
      <ellipse cx="260" cy="240" rx="110" ry="50"/>
      <ellipse cx="420" cy="210" rx="90" ry="42"/>
      <ellipse cx="620" cy="230" rx="130" ry="56"/>
      <ellipse cx="840" cy="200" rx="110" ry="46"/>
      <ellipse cx="1060" cy="220" rx="140" ry="60"/>
      <ellipse cx="1280" cy="230" rx="90" ry="42"/>
      <ellipse cx="1480" cy="210" rx="120" ry="50"/>
    </g>
  </g>

  <!-- sun + glow (subtle) -->
  <g transform="translate(1200,90)">
    <circle cx="0" cy="40" r="60" fill="#fff3c9" opacity="0.98" />
    <circle cx="0" cy="40" r="140" fill="url(#sunGlow)" opacity="0.6" />
  </g>

  <!-- rolling fields foreground -->
  <g transform="translate(0,220)">
    <path d="M0,220 C220,160 360,170 560,176 C760,182 900,148 1140,170 C1320,187 1460,160 1600,180 L1600,380 L0,380 Z" fill="url(#field)"/>
    <path d="M0,260 C140,230 340,240 520,248 C700,256 880,230 1160,248 C1360,260 1500,240 1600,248 L1600,380 L0,380 Z" fill="#1f5b38" opacity="0.86"/>
    <path d="M0,290 C200,260 440,272 640,280 C840,288 1080,270 1360,288 C1480,296 1560,288 1600,290 L1600,380 L0,380 Z" fill="#154b2d" opacity="0.6"/>
  </g>

  <!-- subtle vignette & light texture -->
  <rect width="1600" height="600" fill="black" opacity="0.03"/>
</svg>
