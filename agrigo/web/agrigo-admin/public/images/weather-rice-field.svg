<?xml version="1.0" encoding="utf-8"?>
<!-- Rice paddy landscape SVG: stylized fields and rice stalk silhouettes -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="skyR" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#dff5ff"/>
      <stop offset="60%" stop-color="#c6f1df"/>
      <stop offset="100%" stop-color="#a8e0b6"/>
    </linearGradient>
    <linearGradient id="fieldR" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#8fd18f"/>
      <stop offset="100%" stop-color="#2e8a45"/>
    </linearGradient>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence baseFrequency="0.8" numOctaves="1" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic"/>
    </filter>
  </defs>
  <rect width="1600" height="600" fill="url(#skyR)"/>

  <!-- distant hills and trees -->
  <g transform="translate(0,80)">
    <path d="M0,220 C160,180 340,200 520,210 C700,220 920,190 1160,210 C1360,228 1500,200 1600,220 L1600,600 L0,600 Z" fill="#2a5f3f" opacity="0.95"/>
    <path d="M0,260 C200,230 460,242 660,250 C860,258 1080,236 1320,254 C1480,268 1540,248 1600,256 L1600,600 L0,600 Z" fill="#1f6f3f" opacity="0.88"/>
  </g>

  <!-- rice terraces foreground -->
  <g transform="translate(0,260)">
    <path d="M0,200 C200,170 420,160 640,170 C860,180 1080,150 1320,170 C1480,184 1560,170 1600,170 L1600,600 L0,600 Z" fill="url(#fieldR)"/>
    <path d="M0,230 C180,200 400,194 620,200 C840,206 1040,188 1280,204 C1440,216 1540,200 1600,206 L1600,600 L0,600 Z" fill="#247a3c" opacity="0.85"/>
    <path d="M0,260 C160,236 380,238 580,246 C780,254 980,236 1220,252 C1400,264 1520,252 1600,256 L1600,600 L0,600 Z" fill="#185d2c" opacity="0.6"/>
  </g>

  <!-- rice stalk silhouettes (decorative) -->
  <g transform="translate(80,360)" fill="#123823" opacity="0.95">
    <path d="M0,0 C4,-20 12,-34 18,-42 C22,-48 28,-50 34,-46 C36,-44 34,-40 30,-38 C24,-36 18,-28 16,-18 C14,-10 6,4 0,20 Z"/>
    <path d="M40,10 C46,-6 56,-22 66,-30 C72,-36 80,-40 86,-38 C88,-36 86,-30 82,-28 C76,-24 70,-18 68,-10 C66,-4 58,12 52,24 Z"/>
  </g>

  <!-- subtle vignette -->
  <rect width="1600" height="600" fill="black" opacity="0.04"/>
</svg>
