plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    namespace = "com.example.agrigo"
    compileSdk = 36  // CHANGED from 34 to 36
    ndkVersion = flutter.ndkVersion
compileOptions {
    coreLibraryDesugaringEnabled true
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
}


    kotlinOptions {
        jvmTarget = "17"  // CHANGED from "1.8"
    }

    defaultConfig {
        applicationId = "com.example.agrigo"
        minSdk = flutter.minSdkVersion
        targetSdk = 36  // CHANGED from 34 to 36
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
        multiDexEnabled = true
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = '../..'
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:32.7.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.facebook.android:facebook-android-sdk:16.0.0'
    // Update desugar_jdk_libs dari 2.0.4 ke 2.1.4 atau lebih tinggi
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}

apply plugin: 'com.google.gms.google-services'
